# Static files, and nothing else. There is no API to proxy and no origin to reach: the app talks
# to nobody, which is the property the whole project rests on.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The decoder and the store are large-ish JavaScript; serving them compressed is most of the
    # difference between a fast first load and a slow one.
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every asset, so they can be cached indefinitely...
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ...but never the entry document, or an upgrade would serve yesterday's app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
